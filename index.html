<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F1ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E0D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="One Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>One Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell. Rail on desktop, bottom tab bar on phones, one command bar on top.
   Chrome is warm monochrome (ink on stone); colour belongs to the seven sections, each with its own hue.
   Every progress bar carries two facts: where you are (fill) and where the calendar says you should be (tick). */
:root{
  --bg:#F3F1ED; --surface:#FFFFFF; --surface-2:#ECE9E4; --ink:#191715; --muted:#6A655E; --line:#E2DED7; --on-hue:#FFFFFF;
  --c-today:#191715; --c-meals:#B86E00; --c-study:#9D3C8B; --c-projects:#5E7A0F; --c-budget:#14804A; --c-schedule:#C2255C; --c-fitness:#D2440C; --c-roadmap:#8A5A2B;
  --good:#14804A; --warn:#A86400; --bad:#C62F2F;
  --hue:var(--ink); --hue-soft:color-mix(in srgb,var(--hue) 12%,var(--surface));
  --good-soft:color-mix(in srgb,var(--good) 14%,var(--surface)); --warn-soft:color-mix(in srgb,var(--warn) 16%,var(--surface)); --bad-soft:color-mix(in srgb,var(--bad) 13%,var(--surface));
  --scrim:rgba(20,18,16,.42); --shadow:0 1px 2px rgba(25,23,21,.05),0 8px 24px -12px rgba(25,23,21,.12);
  --font-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dw:800; --dt:-.045em; --dz:.84; --vw:700; --vz:.78; --vstyle:normal;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.5,1);
  --r-lg:18px; --r-md:12px;
}
:root[data-font="outfit"]{--font-display:"Outfit",system-ui,sans-serif;--font-body:"DM Sans",system-ui,sans-serif;--dw:600;--dt:-.03em;--dz:.94;--vw:500;--vz:.86}
:root[data-font="sora"]{--font-display:"Sora",system-ui,sans-serif;--font-body:"Manrope",system-ui,sans-serif;--dw:700;--dt:-.05em;--dz:.78;--vw:600;--vz:.72}
:root[data-font="serif"]{--font-display:"Instrument Serif","Iowan Old Style",Georgia,serif;--font-body:"Geist",system-ui,sans-serif;--dw:400;--dt:-.01em;--dz:1;--vw:400;--vz:1;--vstyle:italic}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E0D; --surface:#191816; --surface-2:#24221F; --ink:#F3F0EB; --muted:#A49F97; --line:#2F2C28; --on-hue:#12110F;
    --c-today:#F3F0EB; --c-meals:#F0B040; --c-study:#DE8FCE; --c-projects:#B7CE5C; --c-budget:#5FD39A; --c-schedule:#F47FA4; --c-fitness:#FF8B5E; --c-roadmap:#D9A877;
    --good:#5FD39A; --warn:#F0B040; --bad:#FF7A70;
    --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E0D; --surface:#191816; --surface-2:#24221F; --ink:#F3F0EB; --muted:#A49F97; --line:#2F2C28; --on-hue:#12110F;
  --c-today:#F3F0EB; --c-meals:#F0B040; --c-study:#DE8FCE; --c-projects:#B7CE5C; --c-budget:#5FD39A; --c-schedule:#F47FA4; --c-fitness:#FF8B5E; --c-roadmap:#D9A877;
  --good:#5FD39A; --warn:#F0B040; --bad:#FF7A70;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
.h-today{--hue:var(--c-today)} .h-meals{--hue:var(--c-meals)} .h-study{--hue:var(--c-study)} .h-projects{--hue:var(--c-projects)}
.h-budget{--hue:var(--c-budget)} .h-schedule{--hue:var(--c-schedule)} .h-fitness{--hue:var(--c-fitness)} .h-roadmap{--hue:var(--c-roadmap)}
.h-today,.h-meals,.h-study,.h-projects,.h-budget,.h-schedule,.h-fitness,.h-roadmap{--hue-soft:color-mix(in srgb,var(--hue) 13%,var(--surface))}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
body{-webkit-tap-highlight-color:transparent}
a,button,label,input[type=checkbox]{touch-action:manipulation}
h1,h2,h3,p,ul{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font-family:var(--font-body);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:17px;background:var(--surface)}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;padding-block:22px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:10px}
.brand{display:flex;align-items:center;gap:10px;padding-inline:8px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.mark{width:24px;height:24px;border-radius:50%;flex:none;background:conic-gradient(var(--c-meals),var(--c-fitness),var(--c-schedule),var(--c-study),var(--c-roadmap),var(--c-projects),var(--c-budget),var(--c-meals));
  -webkit-mask:radial-gradient(circle,transparent 6px,#000 6.6px);mask:radial-gradient(circle,transparent 6px,#000 6.6px)}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav-ind{position:absolute;top:0;left:0;right:0;height:42px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.nav a{position:relative}
.nav a{display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a kbd{margin-left:auto;opacity:0}
.nav a:hover{color:var(--ink)} .nav a:hover kbd{opacity:1}
.nav a[aria-current="page"]{color:var(--ink)}
.tile-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--hue-soft);color:var(--hue)}
.nav a[aria-current="page"] .tile-ic{background:var(--hue);color:var(--on-hue)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-inline:8px}
.sync{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--warn)}
.stage{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:12px;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search{display:flex;align-items:center;gap:9px;flex:1;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;color:var(--muted);text-align:left}
.search:hover{border-color:var(--muted)}
.search span{flex:1}
.main{padding-block:8px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}
@media (max-width:880px){
  .app{display:block}
  .rail{display:none}
  .only-wide{display:none!important}
  .topbar{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .main{padding-block:6px calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;position:fixed;left:0;right:0;bottom:0;z-index:8;
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:4px 0;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none}
  .tabbar .on{color:var(--ink)}
  .tabbar .on .ico{stroke-width:2.3}
  .tab-ind{position:absolute;top:0;left:0;width:32px;height:3px;border-radius:0 0 4px 4px;background:var(--ink)}
  .tabbar .fab{width:50px;height:50px;border-radius:50%;background:var(--ink);color:var(--on-hue);justify-content:center;margin:-4px auto 0;box-shadow:var(--shadow)}
  .tabbar .fab .ico{width:22px;height:22px;stroke-width:2.2}
}
@media (min-width:881px){.only-narrow{display:none!important}}

/* type */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding-top:6px}
.page-head h1{font-family:var(--font-display);font-size:calc(46px*var(--dz));font-weight:var(--dw);letter-spacing:var(--dt);line-height:1.05;text-wrap:balance}
.page-head h1::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hue);margin-left:8px}
.page-head p{color:var(--muted);margin-top:8px;max-width:60ch}
.label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h2{font-size:16px;font-weight:600;letter-spacing:-.005em}
h3{font-size:15px;font-weight:600}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hue);flex:none;display:inline-block}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:500;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:var(--on-hue)}
.btn-primary:hover{border-color:var(--ink);opacity:.88}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:4px 11px;font-size:13px}
.icon-btn{border:0;background:transparent;color:var(--muted);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;flex:none;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.link-btn{border:0;background:none;padding:0;color:var(--muted);font-weight:500;font-size:13.5px;text-decoration:none}
.link-btn:hover{color:var(--ink);text-decoration:underline}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;background:var(--surface);padding:1px}
.stepper span{padding:0 6px;font-weight:500;font-size:14px;min-width:9.5em;text-align:center}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:9px 12px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
textarea{resize:vertical}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--muted);background:transparent;flex:none;margin:0;display:grid;place-content:center;cursor:pointer}
input[type=checkbox]:hover{border-color:var(--hue)}
input[type=checkbox]:checked{background:var(--hue);border-color:var(--hue)}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-hue);border-bottom:2px solid var(--on-hue);transform:translateY(-1px) rotate(-45deg)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-head h2{display:flex;align-items:center;gap:9px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1080px){.cols{grid-template-columns:minmax(0,1fr)}}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;display:flex;flex-direction:column;gap:5px;min-width:0;text-decoration:none;box-shadow:var(--shadow)}
a.tile:hover{border-color:var(--hue)}
.tile .label{display:flex;align-items:center;gap:7px}
.tile .label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hue);flex:none}
.tile .big{font-family:var(--font-display);font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .big small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.tile>small{color:var(--muted);font-size:13px}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .big{font-size:clamp(19px,5.8vw,27px)}}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.hero-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.hero h1{font-family:var(--font-display);font-size:calc(50px*var(--dz));font-weight:var(--dw);line-height:1.05;letter-spacing:var(--dt);text-wrap:balance;margin-top:6px}
.hero p{color:var(--muted);margin-top:8px}
.hero-ring{display:flex;align-items:center;gap:13px;text-decoration:none;border-radius:16px;padding:6px}
.hero-ring:hover{background:var(--surface-2)}
@media (max-width:560px){.hero h1{font-size:calc(41px*var(--dz))}.page-head h1{font-size:calc(41px*var(--dz))}}
.weekrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:14px;text-decoration:none;background:var(--surface-2)}
.wd:hover{outline:1px solid var(--muted)}
.wd small{font-size:11.5px;color:var(--muted);font-weight:500}
.wd b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.wd.now{background:var(--ink);color:var(--on-hue)} .wd.now small{color:inherit;opacity:.75}
.pips{display:flex;gap:3px;height:5px}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--c-schedule)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;border:1px dashed var(--muted);border-radius:var(--r-md);padding:10px 14px;font-size:14px}
.note{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--surface-2);color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.empty b{color:var(--ink);font-weight:600}

.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--hue-soft);color:var(--hue)}
.chip{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 9px;white-space:nowrap}
.t-good{color:var(--good)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)}

.bar{position:relative;height:8px;border-radius:99px;background:var(--surface-2)}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--hue);max-width:100%}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t small{display:block;color:var(--muted);font-size:13px}
.row .r{flex:none;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums}
.row-btn{border:0;background:none;padding:0;text-align:left;font-weight:500;width:100%;overflow-wrap:anywhere}
.row-btn:hover{text-decoration:underline}
.done .row-btn{text-decoration:line-through;color:var(--muted)}
.time{flex:none;width:92px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.group-label{margin-top:8px;display:flex;align-items:center;gap:8px}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1}

/* meals + schedule week grids */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.is-today{border-color:var(--hue);box-shadow:0 0 0 1px var(--hue)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-weight:600;font-size:14px}
.day-h small{font-weight:500;color:var(--muted)}
.is-today .day-h{color:var(--hue)}
.slot label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.slot textarea{padding:6px 9px;font-size:13.5px;min-height:46px;resize:none;background:var(--surface-2);border-color:transparent;border-radius:10px}
.slot textarea:focus{background:var(--surface)}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--hue);background:var(--hue-soft);border-radius:8px;padding:6px 8px;font-size:13px;overflow-wrap:anywhere}
.ev small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.ev.c-study{--hue:var(--c-study);--hue-soft:color-mix(in srgb,var(--hue) 13%,var(--surface))}
.ev.c-exercise{--hue:var(--c-fitness);--hue-soft:color-mix(in srgb,var(--hue) 13%,var(--surface))}
.ev.c-work{--hue:var(--c-projects);--hue-soft:color-mix(in srgb,var(--hue) 13%,var(--surface))}
.ev.c-personal{--hue:var(--c-roadmap);--hue-soft:color-mix(in srgb,var(--hue) 13%,var(--surface))}
.ev.c-due{--hue:var(--bad);--hue-soft:var(--bad-soft)}
.ev.c-gcal{background:transparent;border:1px solid var(--line);border-left:3px solid var(--muted);text-decoration:none;color:inherit}
a.ev.c-gcal:hover{border-color:var(--muted)}
.gcal-line{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px;color:var(--muted)}

  .tabbar .on .ico{transform:translateY(-1px) scale(1.12)}
  .nav-ind{transition:transform .5s var(--spring),height .2s ease}
  .tab-ind{transition:transform .5s var(--spring)}
  .btn:active,.qtile:active,.wd:active,a.tile:active,.ev:active,.search:active,.pal-item:active{transform:scale(.96)}
  .icon-btn:active,.tabbar a:active,.tabbar button:active{transform:scale(.9)}
  @media (hover:hover){a.tile:hover,.qtile:hover,.wd:hover{transform:translateY(-2px)}}
  /* entrance: sections rise in sequence, then bars, rings and chart lines draw themselves */
  .wrap.enter>*{animation:rise .6s var(--ease) backwards}
  .wrap.enter>*:nth-child(2){animation-delay:.06s} .wrap.enter>*:nth-child(3){animation-delay:.12s} .wrap.enter>*:nth-child(4){animation-delay:.18s}
  .wrap.enter>*:nth-child(5){animation-delay:.24s} .wrap.enter>*:nth-child(n+6){animation-delay:.3s}

  .wrap.enter :is(.strip,.week,.weekrow,.proj-grid,.stack)>*:nth-child(1){animation-delay:.14s} .wrap.enter :is(.strip,.week,.weekrow,.proj-grid,.stack)>*:nth-child(2){animation-delay:.19s}
  .wrap.enter :is(.strip,.week,.weekrow,.proj-grid,.stack)>*:nth-child(3){animation-delay:.24s} .wrap.enter :is(.strip,.week,.weekrow,.proj-grid,.stack)>*:nth-child(4){animation-delay:.29s}
  .wrap.enter :is(.strip,.week,.weekrow,.proj-grid,.stack)>*:nth-child(5){animation-delay:.34s} .wrap.enter :is(.strip,.week,.weekrow,.proj-grid,.stack)>*:nth-child(6){animation-delay:.39s}
  .wrap.enter :is(.strip,.week,.weekrow,.proj-grid,.stack)>*:nth-child(n+7){animation-delay:.44s}
  .wrap.enter .bar>i,.wrap.enter .g-seg>i{transform-origin:left;animation:growX .9s var(--ease) .25s backwards}
  .wrap.enter .ring circle:last-of-type{animation:ring 1.2s var(--ease) .15s backwards}
  .wrap.enter .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .3s forwards}
  .wrap.enter .chart rect{transform-box:fill-box;transform-origin:bottom;animation:growY .8s var(--ease) .3s backwards}
  .pop{animation:tick .45s var(--spring)}
  .reveal{animation:reveal .4s var(--ease)}
  dialog[open]{animation:sheetIn .45s var(--ease)}
  dialog[open]::backdrop{animation:fade .3s ease}
  dialog.closing{animation:sheetOut .19s ease-in forwards}
  dialog.closing::backdrop{animation:fadeOut .19s ease forwards}
  .toast:not([hidden]){animation:toastIn .4s var(--spring)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  @keyframes growX{from{transform:scaleX(0)}}

  @keyframes toastIn{from{opacity:0;translate:0 16px}}
}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1)};
const TODAY=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const weekStart=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
const fmt=(s,o)=>pd(s).toLocaleDateString(undefined,o);
const clamp=x=>Math.max(0,Math.min(1,isFinite(x)?x:0));
const pct=x=>Math.round(clamp(x)*100);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
const shiftMonth=(m,n)=>{const d=pd(m+'-01');d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)};
const svg=d=>'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/></svg>';
function relDue(due){const d=diffDays(due,TODAY());
  if(d<0)return (-d)+(d===-1?' day':' days')+' overdue'; if(d===0)return 'Today'; if(d===1)return 'Tomorrow';
  if(d<7)return fmt(due,{weekday:'long'}); return fmt(due,{day:'numeric',month:'short'})}

/* ---------- store ---------- */
const COLS=['tasks','projects','tx','events','weights','workouts','goals','groceries','mealweeks','recipes','settings'];
const S=Object.fromEntries(COLS.map(c=>[c,[]]));
const LKEY='onehub.v1';
let db=null, mode='loading', slow=false, syncErr=false, privateView=false;
const queues=new Map();
function commit(col,id,rec){
  if(mode==='local'){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){toast('This browser would not save that change.')}return}
  if(mode==='supa'){queueOp(col,id,rec);return}
  if(!db)return;
  const ref=db.collection(col).doc(id); let body=null;
  if(rec){body=clone(rec);delete body.id}
  const run=()=>(body?ref.set(body):ref.delete()).catch(()=>toast('That change was not saved. Check your connection and try again.'));
  const key=col+'/'+id; const p=(queues.get(key)||Promise.resolve()).then(run); queues.set(key,p);
}
function save(col,rec,quiet){
  if(!rec.id)rec.id=uid();
  const i=S[col].findIndex(r=>r.id===rec.id);
  if(i>=0)S[col][i]=rec;else S[col].push(rec);
  commit(col,rec.id,rec); if(!quiet)render(); return rec;
}
function saveClean(col,rec,quiet){delete rec.example;return save(col,rec,quiet)}
function remove(col,id,quiet){S[col]=S[col].filter(r=>r.id!==id);commit(col,id,null);if(!quiet)render()}
const find=(col,id)=>S[col].find(r=>r.id===id);

/* ---------- standalone app: Supabase sign-in, offline copy, queue of unsent changes ---------- */
const HC=window.HUB_CONFIG&&window.HUB_CONFIG.url?window.HUB_CONFIG:null,SKEY='onehub.supa.v1';
let sb=null,sbUser=null,outbox=[],flushing=false;
function persistSupa(){try{localStorage.setItem(SKEY,JSON.stringify({uid:sbUser&&sbUser.id,email:sbUser&&sbUser.email,S,outbox}))}catch(e){}}
function queueOp(col,id,rec){
  outbox=outbox.filter(o=>!(o.col===col&&o.id===id));let data=null;if(rec){data=clone(rec);delete data.id}
  outbox.push({col,id,data});persistSupa();flush()}
async function flush(){
  if(flushing||!sb||!sbUser||!outbox.length)return;flushing=true;
  try{
    while(outbox.length){const o=outbox[0];
      const r=o.data?await sb.from('hub_docs').upsert({user_id:sbUser.id,col:o.col,id:o.id,data:o.data,updated_at:new Date().toISOString()},{onConflict:'user_id,col,id'})
        :await sb.from('hub_docs').delete().eq('user_id',sbUser.id).eq('col',o.col).eq('id',o.id);
      if(r.error)throw r.error;
      outbox=outbox.filter(x=>x!==o);persistSupa()}
    syncErr=false;
  }catch(e){syncErr=true}
  flushing=false;scheduleRender()}
async function pull(){
  if(!sb||!sbUser)return;
  try{
    let rows=[],from=0;
    for(;;){const r=await sb.from('hub_docs').select('col,id,data').eq('user_id',sbUser.id).order('col').order('id').range(from,from+999);
      if(r.error)throw r.error;rows=rows.concat(r.data);if(r.data.length<1000)break;from+=1000}
    const next=Object.fromEntries(COLS.map(c=>[c,[]]));
    rows.forEach(r=>{if(next[r.col])next[r.col].push({...r.data,id:r.id})});
    outbox.forEach(o=>{if(!next[o.col])return;next[o.col]=next[o.col].filter(r=>r.id!==o.id);if(o.data)next[o.col].push({...o.data,id:o.id})});
    const same=JSON.stringify(next)===JSON.stringify(S),was=syncErr;COLS.forEach(c=>{S[c]=next[c]});syncErr=false;persistSupa();
    if(!same||was)scheduleRender();flush();
  }catch(e){syncErr=true;scheduleRender()}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function enterMode(m){mode=m;enterPending=true;render()}
async function startSupa(){
  let cache=null;try{cache=JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){}
  const useCache=()=>{if(cache&&cache.S)COLS.forEach(c=>{if(Array.isArray(cache.S[c]))S[c]=cache.S[c]});outbox=(cache&&cache.outbox)||[]};
  const offline=()=>{sbUser={id:cache.uid,email:cache.email};useCache();syncErr=true;enterMode('supa')};
  const acct=$('#acct-btn');if(acct)acct.hidden=false;
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
    sb=window.supabase.createClient(HC.url,HC.key);
    const got=await sb.auth.getSession(),ses=got.data&&got.data.session;
    sb.auth.onAuthStateChange((ev,s)=>{

function weightChart(){
  const pts=weightsSorted().slice(-60),u=cfg().unit;
  if(pts.length<2)return empty('Log two or more weights to see your trend line.');
  const goal=goalWeight(),W=520,H=230,L=50,R=18,T=28,B=32;
  const pace=(find('settings','plan')||{}).pace,p0=pts[0],pN=pts[pts.length-1],wks=diffDays(pN.date,p0.date)/7,dir=goal!=null&&goal<p0.v?-1:1;
  const band=pace&&goal!=null&&wks>0?[p0.v+dir*pace.lo*wks,p0.v+dir*pace.hi*wks]:null;
  const vals=pts.map(p=>p.v).concat(goal!=null?[goal]:[],band||[]);let lo=Math.min(...vals),hi=Math.max(...vals);
  const padv=Math.max(.4,(hi-lo)*.14);lo-=padv;hi+=padv;
  const d0=pts[0].date,last=pts[pts.length-1],span=Math.max(1,diffDays(last.date,d0));
  const X=d=>L+(W-L-R)*diffDays(d,d0)/span,Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=line+` L${X(last.date).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*(i+.5)/4);
  const near=goal!=null&&Math.abs(Y(goal)-Y(last.v))<26;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${esc(fmt(d0,{day:'numeric',month:'short'}))} to ${esc(fmt(last.date,{day:'numeric',month:'short'}))}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" fill="none"/><text x="${L-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`).join('')}
    <path d="${area}" fill="var(--hue-soft)" stroke="none"/>
    ${band?`<polygon points="${X(p0.date).toFixed(1)},${Y(p0.v).toFixed(1)} ${X(pN.date).toFixed(1)},${Y(band[1]).toFixed(1)} ${X(pN.date).toFixed(1)},${Y(band[0]).toFixed(1)}" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1" stroke-opacity=".6"/>`:''}
    ${goal!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/><text x="${near?L+6:W-R}" y="${(Y(goal)-6).toFixed(1)}" text-anchor="${near?'start':'end'}" style="fill:var(--good)">Goal ${goal} ${esc(u)}</text>`:''}
    <path class="draw" pathLength="1" d="${line}" fill="none" stroke="var(--hue)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.date).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4.5" fill="var(--hue)" stroke="var(--surface)" stroke-width="2"/>
    <text class="strong" x="${X(last.date).toFixed(1)}" y="${(Y(last.v)-11).toFixed(1)}" text-anchor="end">${last.v.toFixed(1)}</text>
    <text x="${L}" y="${H-8}">${esc(fmt(d0,{day:'numeric',month:'short'}))}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${esc(fmt(last.date,{day:'numeric',month:'short'}))}</text></svg>
    ${band?`<p class="muted" style="font-size:13px">Green band: the healthy pace of ${+pace.lo} to ${+pace.hi} ${esc(u)} a week, measured from your first weigh-in.</p>`:''}`;
}
function workoutChart(){

  const weeks=[...Array(8)].map((_,i)=>{const s=addDays(ws,-7*(7-i));return {s,n:workoutsBetween(s,addDays(s,6)).length}});
  const max=Math.max(target,1,...weeks.map(w=>w.n))+1,W=520,H=210,L=10,R=84,T=22,B=30,bw=(W-L-R)/8;
  const Y=n=>T+(H-T-B)*(1-n/max);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Workouts per week for the last eight weeks">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1" fill="none"/>
    ${weeks.map((w,i)=>{const x=L+i*bw+bw*.2,h=H-B-Y(w.n);return `${w.n?`<rect x="${x.toFixed(1)}" y="${Y(w.n).toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${h.toFixed(1)}" rx="6" fill="${target&&w.n>=target?'var(--hue)':'var(--hue-soft)'}" stroke="var(--hue)" stroke-width="${target&&w.n>=target?0:1.2}"/>`:''}
      <text class="strong" x="${(x+bw*.3).toFixed(1)}" y="${(Y(w.n)-6).toFixed(1)}" text-anchor="middle">${w.n}</text>
      ${i%2===1||i===7?`<text x="${(x+bw*.3).toFixed(1)}" y="${H-9}" text-anchor="middle">${i===7?'This week':esc(fmt(w.s,{day:'numeric',month:'short'}))}</text>`:''}`}).join('')}
    ${target?`<line x1="${L}" x2="${W-R+6}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/><text x="${W-R+10}" y="${(Y(target)+4).toFixed(1)}">Target ${target}</text>`:''}</svg>`;
}

function gantt(rows){
  const t=TODAY();
  const min=[t,...rows.map(r=>r.g.start)].sort()[0],max=[addDays(t,60),...rows.map(r=>r.g.target)].sort().pop();
  const span=Math.max(1,diffDays(max,min)),x=d=>clamp(diffDays(d,min)/span)*100,xt=x(t);
  const years=[];for(let y=pd(min).getFullYear()+1;y<=pd(max).getFullYear();y++)years.push(y);
  const pos=p=>p<8?`left:${p}%`:p>92?`right:${100-p}%`:`left:${p}%;transform:translateX(-50%)`;
  const grid=years.map(y=>`<u style="left:${x(y+'-01-01')}%"></u>`).join('');
  const horizon=g=>g.done?3:diffDays(g.target,t)<=365?0:diffDays(g.target,t)<=1095?1:2;
  const names=['Within a year','One to three years out','Three years and beyond','Reached'];
  const sorted=[...rows].sort((a,b)=>horizon(a.g)-horizon(b.g)||(a.g.target<b.g.target?-1:1));
  let last=-1;
  return `<div class="gantt"><div class="g-axis" aria-hidden="true"><span class="now" style="${pos(xt)}">Today</span>${years.map(y=>`<span style="${pos(x(y+'-01-01'))}">${y}</span>`).join('')}</div>
  ${sorted.map(({g,s})=>{const h=horizon(g),head=h!==last?`<div class="label" style="padding:14px 0 8px">${names[h]}</div>`:'';last=h;
    const l=x(g.start),w=Math.max(1,x(g.target)-l),open=ui.openGoals.has(g.id),ms=g.milestones||[];
    return `${head}<div class="g-row"><button class="g-head" data-act="toggleGoal" data-id="${g.id}" type="button" aria-expanded="${open}">
      <span class="g-title">${esc(g.title)}</span><span class="chip">${esc(g.area||'Personal')}</span>${pill(s.status,s.tone)}<span class="g-date">by ${esc(fmt(g.target,{month:'short',year:'numeric'}))}</span></button>
      <div class="g-track">${grid}<div class="g-seg ${s.tone}" style="left:${l}%;width:${w}%"><i style="width:${pct(s.habit?s.time*s.align:s.fill)}%"></i></div><b style="left:${xt}%"></b></div>
      ${open?`<div class="g-detail" id="gd-${g.id}">
        <div class="proj-meta"><span class="num"><b style="color:var(--ink)">${pct(s.fill)}%</b> ${s.habit?'of your weekly target kept':'done'}</span>${s.habit?'':`<span class="num">${pct(s.exp)}% of the time used</span>`}${!g.done&&!s.habit&&s.gap>0?`<span class="t-${s.tone}">${s.gap} points behind pace</span>`:''}</div>
        <p>${esc(s.detail)}</p>${g.why?`<p class="muted">Why it matters: ${esc(g.why)}</p>`:''}
        ${g.track==='milestones'?`<div>${ms.map(m=>`<div class="ms"><label><input type="checkbox" id="gm-${g.id}-${m.id}" data-chg="goalMs" data-id="${g.id}" data-ms="${m.id}" ${m.done?'checked':''}><span class="${m.done?'is-done':''}">${esc(m.text)}</span></label><button class="icon-btn" data-act="delGoalMs" data-id="${g.id}" data-ms="${m.id}" type="button" aria-label="Remove milestone">×</button></div>`).join('')}
          <form class="inline-add" data-sub="addGoalMs" data-id="${g.id}" style="margin-top:6px"><input type="text" id="gmnew-${g.id}" placeholder="Add a milestone" autocomplete="off" aria-label="New milestone"><button class="btn" type="submit">Add</button></form></div>`:''}
        <div class="head-actions"><button class="btn btn-sm" data-act="editGoal" data-id="${g.id}" type="button">Edit goal</button><button class="btn btn-sm" data-act="goalDone" data-id="${g.id}" type="button">${g.done?'Reopen':'Mark as reached'}</button></div></div>`:''}
    </div>`}).join('')}</div>`;
}
V.roadmap=function(){

  if(al){const worst=[...al.rows].filter(r=>!r.g.done).sort((a,b)=>a.s.align-b.s.align)[0];

function glide(old){
  if(REDUCE||old.r!==route)return;
  const opt={duration:650,easing:'cubic-bezier(.2,.8,.2,1)'},els=barEls(),rings=ringEls();
  if(els.length===old.w.length)els.forEach((e,i)=>{if(old.w[i]!==e.style.width&&e.animate)e.animate([{width:old.w[i]},{width:e.style.width}],opt)});
  if(rings.length===old.ring.length)rings.forEach((e,i)=>{const n=e.getAttribute('stroke-dasharray');if(old.ring[i]!==n&&e.animate)e.animate([{strokeDasharray:old.ring[i]},{strokeDasharray:n}],opt)});
}

  const vals={...x,tWeight:x.track==='weight'?x.targetValue:'',tSave:x.track==='savings'?x.targetValue:'',tWeek:x.track==='workouts'?x.targetValue:'',startValue:x.startValue??(w?w.latest.v:'')};
  openForm({title:x.id?'Edit goal':'Add goal',values:vals,onDelete:x.id&&(()=>removeUndo('goals',x.id,'Goal')),fields:[
  {name:'title',label:'Goal',req:true,full:true,ph:'Where you want to be'},
  {name:'area',label:'Life area',type:'select',options:['Education','Career','Health','Finance','Relationships','Personal'].map(c=>[c,c])},
  {name:'priority',label:'Priority',type:'select',options:[['high','High'],['med','Medium'],['low','Low']]},
  {name:'start',label:'Start date',type:'date',req:true},{name:'target',label:'Target date',type:'date',req:true},
  {name:'track',label:'Measured by',type:'select',full:true,options:[['milestones','Milestones I tick off'],['weight','My weight log'],['savings','Money I set aside in Budget'],['project','A project\'s progress'],['workouts','Workouts per week']]},
  {name:'startValue',label:'Starting weight ('+u+')',type:'number',req:true,showIf:v=>v.track==='weight'},
  {name:'tWeight',label:'Target weight ('+u+')',type:'number',req:true,showIf:v=>v.track==='weight'},
  {name:'tSave',label:'Amount to save ('+cur+')',type:'number',req:true,full:true,showIf:v=>v.track==='savings'},
  {name:'projectId',label:'Project',type:'select',full:true,options:projs.length?projs:[['','Add a project first']],showIf:v=>v.track==='project'},
  {name:'tWeek',label:'Sessions per week',type:'number',req:true,full:true,showIf:v=>v.track==='workouts'},
  {name:'why',label:'Why it matters',type:'textarea',full:true}],
  onSave:v=>{if(v.target<=v.start)return 'The target date needs to be after the start date.';
    if(v.track==='project'&&!v.projectId)return 'Add a project first, then link it here.';
    if(v.track==='weight'&&v.startValue===v.tWeight)return 'Starting and target weight are the same.';
    const tv=v.track==='weight'?v.tWeight:v.track==='savings'?v.tSave:v.track==='workouts'?v.tWeek:null;
    if(tv!=null&&tv<=0)return 'The target needs to be above zero.';
    const rec={milestones:[],...clone(x),title:v.title,area:v.area,priority:v.priority,start:v.start,target:v.target,track:v.track,why:v.why,targetValue:tv,startValue:v.track==='weight'?v.startValue:null,projectId:v.track==='project'?v.projectId:''};
    saveClean('goals',rec);ui.openGoals.add(rec.id);render()}})}
function settingsForm(){const c=cfg();openForm({title:'Settings',values:{...c,font:curFont},fields:[
  {name:'font',label:'Typeface',type:'select',full:true,options:Object.entries(FONTS).map(([k,v])=>[k,v[0]])},
  {name:'name',label:'Your name',ph:'Shown in the greeting'},{name:'currency',label:'Currency symbol',ph:'$'},
  {name:'unit',label:'Weight unit',type:'select',options:[['kg','kg'],['lb','lb']]},
  {name:'workoutTarget',label:'Workouts per week target',type:'number'},
  {name:'goalWeight',label:'Goal weight (optional)',type:'number'}],
  onSave:v=>{const font=v.font;delete v.font;saveCfg(v);
    if(font!==((find('settings','prefs')||{}).font||'jakarta')||font!==curFont){applyFont(font);save('settings',{...clone(find('settings','prefs')||{}),id:'prefs',font})}}})}
function visionForm(){openForm({title:'The future you\'re building',values:cfg(),fields:[
  {name:'vision',label:'In a sentence or two',type:'textarea',full:true,ph:'Who you want to be, and what life looks like when you get there.'}],onSave:v=>{saveCfg(v)}})}

/* ---------- sheets: quick add, more, search ---------- */
function openSheet(html,cls){unshut(sheet);sheet.className=cls||'';sheet.innerHTML=html;if(!sheet.open)sheet.showModal()}
function closeSheet(){shut(sheet)}
const QUICK=[['study','Assignment',()=>taskForm()],['schedule','Event',()=>eventForm()],['budget','Money entry',()=>txForm()],['fitness','Workout',()=>workoutForm()],
  ['fitness','Weight',()=>weightForm()],['roadmap','Goal',()=>goalForm()],['projects','Side project',()=>projectForm(null,'side')],
  ['meals','Grocery item',()=>{location.hash='meals';setTimeout(()=>{const i=$('#grocery-new');if(i)i.focus()},80)}]];
function runQuick(i){const q=QUICK[i];closeSheet();q[2]();if(form)form.quick={msg:q[1]+' added',route:q[0]}}
function quickSheet(){openSheet(`<div class="sheet-body"><div class="grab" aria-hidden="true"></div><header><h2>Add something</h2><button type="button" class="icon-btn" data-act="closeSheet" aria-label="Close">×</button></header>
  <div class="qgrid">${QUICK.map((q,i)=>`<button class="qtile h-${q[0]}" data-act="quick" data-i="${i}" type="button"><span class="tile-ic">${svg(ICON[q[0]])}</span>${q[1]}</button>`).join('')}</div></div>`)}
function moreSheet(){openSheet(`<div class="sheet-body"><div class="grab" aria-hidden="true"></div><header><h2>All sections</h2><button type="button" class="icon-btn" data-act="closeSheet" aria-label="Close">×</button></header>
  <div class="qgrid">${ROUTES.map(([k,l])=>`<a class="qtile h-${k}" href="#${k}" data-act="closeSheet"><span class="tile-ic">${svg(ICON[k])}</span>${l}</a>`).join('')}</div>
  <footer><span class="sync ${mode==='cloud'&&!syncErr?'ok':'warn'}"><i></i><span>${esc(syncText())}</span></span><span class="grow"></span>${mode==='supa'?'<button class="btn btn-sm" data-act="account" type="button">Account</button>':''}<button class="btn btn-sm" data-act="settings" type="button">Settings</button></footer></div>`)}
let palItems=[],palSel=0;
function palIndex(){
  const it=[];
  ROUTES.forEach(([k,l])=>it.push({hue:k,label:l,sub:'Go to section',run:()=>{location.hash=k}}));
  QUICK.forEach((q,i)=>it.push({hue:q[0],label:'New '+q[1].toLowerCase(),sub:'Add',run:()=>runQuick(i)}));
  it.push({hue:'today',label:'Settings',sub:'Name, currency, units and targets',run:()=>settingsForm()});
  S.tasks.forEach(x=>it.push({hue:'study',label:x.title,sub:['Assignment',x.course,x.status==='done'?'Done':x.due?relDue(x.due):''].filter(Boolean).join(' · '),run:()=>taskForm(x)}));
  S.projects.forEach(p=>it.push({hue:p.kind==='study'?'study':'projects',label:p.name,sub:'Project · '+pct(projProg(p))+'% done',run:()=>{location.hash=p.kind==='study'?'study':'projects';projectForm(p)}}));
  S.goals.forEach(g=>it.push({hue:'roadmap',label:g.title,sub:'Goal · '+goalStat(g).status,run:()=>{ui.openGoals.add(g.id);if(route==='roadmap')render();else location.hash='roadmap'}}));
  S.events.forEach(e=>it.push({hue:'schedule',label:e.title,sub:'Event · '+(e.repeat==='weekly'?'every '+fmt(e.date,{weekday:'long'}):fmt(e.date,{day:'numeric',month:'short'})),run:()=>eventForm(e)}));
  S.tx.forEach(x=>{if(x.note)it.push({hue:'budget',label:x.note,sub:money(+x.amount||0)+' · '+fmt(x.date,{day:'numeric',month:'short'}),run:()=>txForm(x)})});
  S.workouts.forEach(x=>it.push({hue:'fitness',label:x.type||'Workout',sub:'Workout · '+fmt(x.date,{day:'numeric',month:'short'}),run:()=>workoutForm(x)}));
  return it;
}
function palRender(){
  const q=$('#pal-q').value.trim().toLowerCase(),all=palIndex();
  palItems=(q?all.filter(i=>(i.label+' '+i.sub).toLowerCase().includes(q)):all.slice(0,ROUTES.length+QUICK.length+1)).slice(0,q?14:40);
  palSel=Math.max(0,Math.min(palSel,palItems.length-1));
  $('#pal-list').innerHTML=palItems.length?palItems.map((it,i)=>`<button class="pal-item h-${it.hue}${i===palSel?' sel':''}" data-act="palRun" data-i="${i}" type="button"><i class="dot"></i><span class="t">${esc(it.label)}<small>${esc(it.sub)}</small></span></button>`).join('')
    :'<p class="empty" style="padding:10px">Nothing matches. Try a section name, an assignment or a goal.</p>';
  const s=$('.pal-item.sel',sheet);if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest'});
}
function palette(){palSel=0;openSheet(`<div class="grab" aria-hidden="true"></div><label class="pal-in" for="pal-q">${svg(ICON.search)}<input id="pal-q" type="search" placeholder="Search assignments, goals, events… or type a section" autocomplete="off" aria-label="Search"></label>
  <div id="pal-list"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></div>`,'pal');
  palRender();$('#pal-q').focus()}
function palRun(i){const it=palItems[i];if(!it)return;closeSheet();it.run()}

/* ---------- actions ---------- */
function touchProject(id,fn){const p=clone(find('projects',id));if(!p)return;p.milestones=p.milestones||[];fn(p);p.updated=TODAY();save('projects',p)}
function touchGoal(id,fn){const g=clone(find('goals',id));if(!g)return;g.milestones=g.milestones||[];fn(g);save('goals',g)}
const A={
  settings:()=>{closeSheet();settingsForm()},closeDlg,closeSheet,
  quickAdd:()=>{if(mode!=='auth')quickSheet()},more:()=>moreSheet(),palette:()=>{if(mode!=='auth')palette()},
  account:()=>{if(mode==='supa')accountSheet()},
  signOut:()=>{closeSheet();if(sb)sb.auth.signOut().catch(()=>{})},
  exportData:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='one-hub-backup-'+TODAY()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
  quick:t=>runQuick(+t.dataset.i),palRun:t=>palRun(+t.dataset.i),
  toastAct:()=>{const f=toastFn;toastFn=null;$('#toast').hidden=true;if(f)f()},
  thisWeek:()=>{ui.week=weekStart(TODAY())},
  formDelete:()=>{const f=form;closeDlg();if(f&&f.onDelete)f.onDelete()},
  clearExamples:()=>{COLS.forEach(c=>S[c].filter(r=>r.example).forEach(r=>remove(c,r.id,true)));render();toast('Examples cleared. The hub is yours.')},
  addTask:()=>taskForm(),editTask:t=>taskForm(find('tasks',t.dataset.id)),toggleDone:()=>{ui.showDone=!ui.showDone;render()},
  addProject:t=>projectForm(null,t.dataset.kind),editProject:t=>projectForm(find('projects',t.dataset.id)),
  delMs:t=>touchProject(t.dataset.id,p=>{p.milestones=p.milestones.filter(m=>m.id!==t.dataset.ms)}),
  mealWeek:t=>{ui.mealWeek=+t.dataset.n?addDays(ui.mealWeek,7*t.dataset.n):weekStart(TODAY());render()},
  week:t=>{ui.week=+t.dataset.n?addDays(ui.week,7*t.dataset.n):weekStart(TODAY());render()},
  month:t=>{ui.month=shiftMonth(ui.month,+t.dataset.n);render()},
  mealTab:t=>{ui.mealTab=t.dataset.k;enterPending=true;render()},
  dayType:t=>{ui.dayType=t.dataset.k;render()},
  fillWeek:()=>{const plan=find('settings','plan');if(!plan||!plan.week)return;
    const ws=ui.mealWeek,prev=find('mealweeks',ws)?clone(find('mealweeks',ws)):null,rec=prev?clone(prev):{id:ws,days:{}};rec.days=rec.days||{};let n=0;
    for(let i=0;i<7;i++){const d=addDays(ws,i),src=plan.week[String(pd(d).getDay())]||{},cur=rec.days[d]||{};
      SLOTS.forEach(([k])=>{if(!cur[k]&&src[k]){cur[k]=src[k];n++}});rec.days[d]=cur}
    if(!n){toast('This week is already filled in.');return}
    saveClean('mealweeks',rec);toast(n+' meals filled from your plan','Undo',()=>{if(prev)save('mealweeks',prev);else remove('mealweeks',ws)})},
  clearGroceries:()=>{S.groceries.filter(g=>g.done).forEach(g=>remove('groceries',g.id,true));render()},
  delGrocery:t=>remove('groceries',t.dataset.id),
  addTx:()=>txForm({type:'expense',date:ui.month===TODAY().slice(0,7)?TODAY():ui.month+'-01'}),editTx:t=>txForm(find('tx',t.dataset.id)),editBudgets:()=>budgetsForm(),
  addEvent:t=>eventForm({date:t.dataset.date||(ui.week===weekStart(TODAY())?TODAY():ui.week),repeat:'none',cat:'Class'}),editEvent:t=>eventForm(find('events',t.dataset.id)),
  calShow:()=>{save('settings',{...clone(find('settings','prefs')||{}),id:'prefs',gcal:true})},
  calHide:()=>{Object.keys(gcal).forEach(k=>delete gcal[k]);save('settings',{...clone(find('settings','prefs')||{}),id:'prefs',gcal:false})},
  calRefresh:()=>{if(calEnabled()){gcalLoad(ui.week,true);render()}},
  addWeight:()=>weightForm(),editWeight:t=>weightForm(find('weights',t.dataset.id)),
  addWorkout:()=>workoutForm(),editWorkout:t=>workoutForm(find('workouts',t.dataset.id)),
  addGoal:()=>goalForm(),editGoal:t=>goalForm(find('goals',t.dataset.id)),editVision:()=>visionForm(),
  toggleGoal:t=>{const s=ui.openGoals,id=t.dataset.id;if(s.has(id))s.delete(id);else{s.add(id);fx.push(['gd-'+id,'reveal'])}render()},
  goalDone:t=>touchGoal(t.dataset.id,g=>{g.done=!g.done}),
  delGoalMs:t=>touchGoal(t.dataset.id,g=>{g.milestones=g.milestones.filter(m=>m.id!==t.dataset.ms)}),
};
const C={
  taskDone:t=>{const x=clone(find('tasks',t.dataset.id));if(!x)return;x.status=t.checked?'done':'todo';x.doneAt=t.checked?TODAY():'';save('tasks',x);
    if(t.checked)toast('Marked done','Undo',()=>{const y=clone(find('tasks',x.id));if(y){y.status='todo';y.doneAt='';save('tasks',y)}})},
  ms:t=>touchProject(t.dataset.id,p=>{const m=p.milestones.find(m=>m.id===t.dataset.ms);if(m)m.done=t.checked}),
  goalMs:t=>touchGoal(t.dataset.id,g=>{const m=g.milestones.find(m=>m.id===t.dataset.ms);if(m)m.done=t.checked}),
  importData:t=>{const file=t.files&&t.files[0];if(!file)return;const fr=new FileReader();
    fr.onload=()=>{let n=0;try{const d=JSON.parse(fr.result);COLS.forEach(c=>{(Array.isArray(d[c])?d[c]:[]).forEach(r=>{if(r&&typeof r==='object'&&r.id){save(c,r,true);n++}})})}catch(e){toast('That file is not a One Hub backup.');return}
      closeSheet();enterPending=true;render();toast(n?n+' entries imported':'That file had no entries to import.')};
    fr.readAsText(file)},
  grocery:t=>{const g=clone(find('groceries',t.dataset.id));if(!g)return;g.done=t.checked;save('groceries',g)},
  meal:t=>{const d=t.dataset.date,ws=weekStart(d),rec=clone(find('mealweeks',ws)||{id:ws,days:{}});rec.days=rec.days||{};
    rec.days[d]={...(rec.days[d]||{}),[t.dataset.slot]:t.value.trim()};saveClean('mealweeks',rec,true);scheduleRender()},
};
const F={
  auth:async(f,btn)=>{const msg=$('#au-msg',f),email=$('#au-email',f).value.trim(),pw=$('#au-pass',f).value,say=(t,ok)=>{msg.textContent=t;msg.style.color=ok?'var(--good)':''};
    if(!sb){say('The sign-in service could not be reached. Check your connection and reload.');return}
    if(!email||pw.length<8){say('Enter your email and a password of at least 8 characters.');return}
    say('Working…',true);
    try{const r=btn&&btn.dataset.up?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
      if(r.error)throw r.error;
      if(r.data&&r.data.session){sbUser=r.data.session.user;enterMode('supa');pull()}
      else say('Account created. Open the confirmation email, then come back here and sign in.',true)}
    catch(e){const m=e&&e.message||'';say(/fetch|network/i.test(m)?'The sign-in service could not be reached. Check your connection and try again.':m?m.replace(/\.$/,'')+'.':'That did not work. Try again.')}},
  addGrocery:f=>{const i=$('input',f),v=i.value.trim();if(!v)return;i.value='';save('groceries',{text:v,done:false,at:Date.now()})},
  addMs:f=>{const i=$('input',f),v=i.value.trim();if(!v)return;i.value='';touchProject(f.dataset.id,p=>{p.milestones.push({id:uid(),text:v,done:false})})},
  addGoalMs:f=>{const i=$('input',f),v=i.value.trim();if(!v)return;i.value='';touchGoal(f.dataset.id,g=>{g.milestones.push({id:uid(),text:v,done:false})})},
};
document.addEventListener('click',e=>{
  if(e.target===dlg){closeDlg();return}
  if(e.target===sheet){closeSheet();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.confirm&&t.dataset.armed!=='1'){t.dataset.armed='1';t.dataset.label=t.textContent;t.textContent=t.dataset.confirm;t.classList.add('danger');
    setTimeout(()=>{if(t.isConnected){t.dataset.armed='';t.textContent=t.dataset.label;t.classList.remove('danger')}},4000);return}
  const fn=A[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('change',e=>{
  if(form&&dlg.contains(e.target)){syncForm();return}
  const t=e.target.closest('[data-chg]');if(!t||!C[t.dataset.chg])return;
  if(t.type==='checkbox'&&t.checked&&t.id)fx.push([t.id,'pop']);
  C[t.dataset.chg](t);
});
dlg.addEventListener('cancel',e=>{e.preventDefault();closeDlg()});
sheet.addEventListener('cancel',e=>{e.preventDefault();closeSheet()});
/* phones: drag a sheet down by its handle to dismiss it */
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('.grab');if(!g)return;drag={d:g.closest('dialog'),y:e.clientY,dy:0};try{g.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!drag)return;drag.dy=Math.max(0,e.clientY-drag.y);drag.d.style.translate='0 '+drag.dy+'px'});
function endDrag(){
  if(!drag)return;const d=drag.d,dy=drag.dy;drag=null;
  if(dy>80){const fin=()=>{d.style.translate='';if(d===dlg)form=null;if(d.open)d.close()};
    if(d.animate&&!REDUCE)d.animate([{translate:'0 '+dy+'px'},{translate:'0 100%'}],{duration:180,easing:'ease-in'}).onfinish=fin;else fin()}
  else{if(dy&&d.animate&&!REDUCE)d.animate([{translate:'0 '+dy+'px'},{translate:'0 0'}],{duration:300,easing:'cubic-bezier(.3,1.4,.5,1)'});d.style.translate=''}
}
document.addEventListener('input',e=>{if(e.target.id==='pal-q'){palSel=0;palRender()}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f-form'){submitForm();return}
  const fn=F[e.target.dataset.sub];if(fn)fn(e.target,e.submitter);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();if(!dlg.open)palette();return}
  if(sheet.open&&sheet.classList.contains('pal')){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();palSel=(palSel+(e.key==='ArrowDown'?1:-1)+palItems.length)%Math.max(1,palItems.length);palRender()}
    else if(e.key==='Enter'){e.preventDefault();palRun(palSel)}
    return}
  if(e.ctrlKey||e.metaKey||e.altKey||dlg.open||sheet.open||mode==='auth')return;
  const tg=e.target;if(tg&&tg.closest&&tg.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='/'){e.preventDefault();palette()}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();quickSheet()}
  else if(/^[1-8]$/.test(e.key)){location.hash=ROUTES[+e.key-1][0]}
});
dlg.addEventListener('close',()=>{form=null});
document.addEventListener('pointerdown',()=>{pointerDown=true},true);
const up=()=>{endDrag();pointerDown=false;if(queued){queued=false;setTimeout(render,0)}};
document.addEventListener('pointerup',up,true);document.addEventListener('pointercancel',up,true);
window.addEventListener('hashchange',setRoute);

/* ---------- boot ---------- */
function startLocal(){
  mode='local';enterPending=true;
  try{const raw=JSON.parse(localStorage.getItem(LKEY)||'null');if(raw)COLS.forEach(c=>{if(Array.isArray(raw[c]))S[c]=raw[c]})}catch(e){}
  setRoute();
}
async function boot(){
  setRoute();
  if(HC){startSupa();return}
  const c=window.claude;
  if(!c||typeof c.use!=='function'){startLocal();return}
  let d=null,u=null;
  try{[d,u,mcp]=await Promise.all([c.use('db'),c.use('user'),c.use('mcp')])}catch(e){}
  if(!d){startLocal();return}
  try{if(u&&(await u.isOwner())===false){privateView=true;render();return}}catch(e){}
  db=d;
  const got=new Set(),fresh=new Set();
  const timer=setTimeout(()=>{slow=true;scheduleRender()},10000);
  const settle=()=>{let ch=false;if(got.size===COLS.length&&mode==='loading'){mode='cloud';enterPending=true;ch=true}
    if(fresh.size===COLS.length){clearTimeout(timer);if(slow){slow=false;ch=true}}return ch};
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const next=snap.docs.map(x=>({...clone(x.data()||{}),id:x.id})),same=JSON.stringify(next)===JSON.stringify(S[col]);
      S[col]=next;
      got.add(col);if(!snap.metadata||!snap.metadata.fromCache)fresh.add(col);
      if(settle()||!same)scheduleRender();
    },()=>{syncErr=true;got.add(col);fresh.add(col);settle();scheduleRender()});
  });
}
boot();
})();
